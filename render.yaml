services:
  - type: web
    name: loan-advisory-backend
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python ingest.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FRONTEND_URL
        sync: false
